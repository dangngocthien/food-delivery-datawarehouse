
# =====================================================================
# DOCKER COMPOSE - Đồ án 18: Giao đồ ăn - Kho dữ liệu đơn hàng
# Ánh xạ dịch vụ GCP -> Open-source (theo Mục 4b file đề tài):
#   GCS          -> MinIO
#   Managed Kafka-> Apache Kafka (Docker)
#   Dataproc     -> Apache Spark
#   BigQuery     -> PostgreSQL
#   Composer     -> Apache Airflow
#   Looker Studio-> Metabase
# =====================================================================
# Chạy: docker compose up -d
# Dừng: docker compose down
# Dừng + xoá luôn dữ liệu: docker compose down -v
# =====================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-boto3 minio kafka-python psycopg2-binary dbt-postgres}
  volumes:
    - ./orchestration_D/dags:/opt/airflow/dags
    - ./orchestration_D/logs:/opt/airflow/logs
    - ./orchestration_D/plugins:/opt/airflow/plugins
    - ./:/opt/airflow/project   # cho DAG gọi được script của A, B, C
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:

  # -------------------------------------------------------------
  # KAFKA (Thành viên A - Ingestion/Streaming)
  # -------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # -------------------------------------------------------------
  # MINIO - Data Lake (raw / cleansed / curated)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio-data:/data

  # -------------------------------------------------------------
  # SPARK (Thành viên B - Spark & Data Lake)
  # -------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      SPARK_MODE: master
    ports:
      - "8080:8080"   # Spark UI
      - "7077:7077"

  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master

  # -------------------------------------------------------------
  # POSTGRES - Data Warehouse (Thành viên C)
  # -------------------------------------------------------------
  postgres-warehouse:
    image: postgres:15
    container_name: postgres-warehouse
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse123
      POSTGRES_DB: food_delivery_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres-warehouse-data:/var/lib/postgresql/data

  # -------------------------------------------------------------
  # POSTGRES - Metadata riêng cho Airflow (tách khỏi warehouse)
  # -------------------------------------------------------------
  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # -------------------------------------------------------------
  # AIRFLOW (Thành viên D - Orchestration)
  # -------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      - airflow-init

  # -------------------------------------------------------------
  # METABASE - Dashboard BI (Thành viên D)
  # -------------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    depends_on:
      - postgres-warehouse

volumes:
  minio-data:
  postgres-warehouse-data:
  postgres-airflow-data:
